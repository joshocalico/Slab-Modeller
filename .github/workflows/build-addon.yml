name: Build drop-in addon

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: addon-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: ${{ matrix.platform }} / ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            arch: x86_64
            runner: ubuntu-22.04
            shell: bash
          - platform: windows
            arch: x86_64
            runner: windows-2022
            shell: 'msys2 {0}'
          - platform: macos
            arch: universal
            runner: macos-14
            shell: bash
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    defaults:
      run:
        shell: ${{ matrix.shell }}
    env:
      SLAB_PLATFORM: ${{ matrix.platform }}
      SLAB_ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        if: runner.os != 'Windows'
        with:
          python-version: '3.12'
      - name: Install SCons
        if: runner.os != 'Windows'
        run: python -m pip install scons==4.8.1
      # The kernel uses exact __int128 predicates. MSVC cannot compile these.
      - uses: msys2/setup-msys2@v2
        if: runner.os == 'Windows'
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-python
            mingw-w64-x86_64-scons
      - name: Build and test editor and export libraries
        run: |
          set -euo pipefail
          extra=()
          if [[ "$SLAB_PLATFORM" == windows ]]; then
            extra+=(use_mingw=yes use_static_cpp=yes)
          elif [[ "$SLAB_PLATFORM" == macos ]]; then
            extra+=(macos_deployment_target=11.0)
          fi
          for target in template_debug template_release; do
            scons platform="$SLAB_PLATFORM" arch="$SLAB_ARCH" target="$target" "${extra[@]}" -j4
            if [[ "$SLAB_PLATFORM" == windows ]]; then
              ./bin/slab_kernel_test.exe
            else
              ./bin/slab_kernel_test
            fi
          done
      - name: Stage runtime binaries
        run: |
          set -euo pipefail
          mkdir -p staged
          for target in template_debug template_release; do
            base="libslab.$SLAB_PLATFORM.$target"
            case "$SLAB_PLATFORM" in
              macos)
                framework="project/addons/slab/bin/$base.framework"
                lipo -verify_arch x86_64 arm64 "$framework/$base"
                codesign --force --sign - "$framework/$base"
                cp -R "$framework" staged/
                ;;
              windows) cp "project/addons/slab/bin/$base.x86_64.dll" staged/ ;;
              linux)
                lib="project/addons/slab/bin/$base.x86_64.so"
                ldd "$lib" | tee dependencies.txt
                if grep -q 'not found' dependencies.txt; then exit 1; fi
                cp "$lib" staged/
                ;;
            esac
          done
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.platform }}
          path: staged/
          if-no-files-found: error
          retention-days: 14

  package:
    name: Assemble installable ZIP
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: native-*
          merge-multiple: true
          path: native
      - name: Test packaging and build archive
        run: |
          python3 tests/test_package.py
          python3 scripts/slab-package --binaries native --output dist/slab-addon.zip
          cd dist
          sha256sum slab-addon.zip > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: slab-addon
          path: dist/
          if-no-files-found: error
          retention-days: 30

  release:
    name: Attach download to draft release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: slab-addon
          path: dist
      - name: Create draft and upload addon
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "$RELEASE_TAG" --notes "Download slab-addon.zip, extract into your Godot project, restart Godot, and enable Slab in Project Settings > Plugins. Includes Windows x64, Linux x64, and universal macOS editor and export libraries."
          fi
          gh release upload "$RELEASE_TAG" dist/slab-addon.zip dist/SHA256SUMS --clobber
